<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Clap It: two hands clapping, with pops of sound -->
  <g fill="none" stroke="#9E73E6" stroke-width="8" stroke-linecap="round">
    <path d="M100 34 L100 14"/><path d="M70 44 L58 28"/><path d="M130 44 L142 28"/>
  </g>
  <g stroke="#4A2C2A" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
    <!-- left hand, tilted in -->
    <g transform="rotate(-18 80 120)">
      <rect x="52" y="64" width="50" height="92" rx="25" fill="#F7C9A0"/>
      <path d="M60 140 Q77 150 94 140" fill="none" stroke="#E0A57A"/>
      <path d="M66 66 L66 96 M78 64 L78 98 M90 66 L90 96" fill="none" stroke-width="5"/>
      <path d="M52 112 Q38 102 40 88 Q42 78 52 84" fill="#F7C9A0"/>
      <rect x="54" y="150" width="46" height="26" rx="10" fill="#F5A3C0"/>
    </g>
    <!-- right hand, tilted in -->
    <g transform="rotate(18 120 120)">
      <rect x="98" y="64" width="50" height="92" rx="25" fill="#F7C9A0"/>
      <path d="M106 140 Q123 150 140 140" fill="none" stroke="#E0A57A"/>
      <path d="M110 66 L110 96 M122 64 L122 98 M134 66 L134 96" fill="none" stroke-width="5"/>
      <path d="M148 112 Q162 102 160 88 Q158 78 148 84" fill="#F7C9A0"/>
      <rect x="100" y="150" width="46" height="26" rx="10" fill="#8FD0F0"/>
    </g>
  </g>
  <g fill="#FFD25A" stroke="#4A2C2A" stroke-width="4" stroke-linejoin="round">
    <path d="M100 46 l5 10 11 2 -8 8 2 11 -10 -5 -10 5 2 -11 -8 -8 11 -2z"/>
  </g>
</svg>
