<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- A picture bingo card with two spots covered -->
  <g transform="rotate(-6 100 104)">
    <rect x="34" y="34" width="132" height="140" rx="18" fill="#D8C8F4" stroke="#4A2C2A" stroke-width="4.5"/>
    <rect x="28" y="28" width="132" height="140" rx="18" fill="#FFFFFF" stroke="#4A2C2A" stroke-width="4.5"/>
    <rect x="28" y="28" width="132" height="30" rx="15" fill="#E9646E" stroke="#4A2C2A" stroke-width="4.5"/>
    <rect x="28" y="44" width="132" height="14" fill="#E9646E"/>
    <path d="M28 58 h132" stroke="#4A2C2A" stroke-width="4.5"/>
    <path d="M72 58 v110 M116 58 v110 M28 94 h132 M28 131 h132" stroke="#4A2C2A" stroke-width="3" opacity=".35"/>
    <!-- sun -->
    <circle cx="50" cy="76" r="10" fill="#F6C945" stroke="#4A2C2A" stroke-width="3"/>
    <!-- heart -->
    <path d="M138 84 l-11 -10 a6 6 0 0 1 11 -6 a6 6 0 0 1 11 6 z" fill="#E9646E" stroke="#4A2C2A" stroke-width="3" stroke-linejoin="round"/>
    <!-- apple -->
    <circle cx="94" cy="114" r="11" fill="#E9646E" stroke="#4A2C2A" stroke-width="3"/>
    <path d="M94 103 q4 -7 10 -6" fill="none" stroke="#4A2C2A" stroke-width="3" stroke-linecap="round"/>
    <!-- fish -->
    <path d="M40 150 q10 -12 20 0 q-10 12 -20 0 z M60 150 l8 -7 v14 z" fill="#5B9BD5" stroke="#4A2C2A" stroke-width="3" stroke-linejoin="round"/>
    <!-- star -->
    <path d="M94 138 l4 8 9 1 -7 6 2 9 -8 -5 -8 5 2 -9 -7 -6 9 -1z" fill="#F6C945" stroke="#4A2C2A" stroke-width="3" stroke-linejoin="round"/>
    <!-- leaf -->
    <ellipse cx="138" cy="150" rx="12" ry="7" fill="#62B866" stroke="#4A2C2A" stroke-width="3" transform="rotate(-30 138 150)"/>
    <!-- covered spots -->
    <rect x="77" y="62" width="34" height="28" rx="8" fill="#62B866" stroke="#4A2C2A" stroke-width="3.5"/>
    <path d="M85 76 l6 6 l12 -12" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="121" y="98" width="34" height="28" rx="8" fill="#62B866" stroke="#4A2C2A" stroke-width="3.5"/>
    <path d="M129 112 l6 6 l12 -12" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="33" y="98" width="34" height="28" rx="8" fill="#F6C945" stroke="#4A2C2A" stroke-width="3.5"/>
    <ellipse cx="44" cy="106" rx="5" ry="3" fill="#fff" opacity=".6"/>
  </g>
</svg>
