<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- The tinted app icon (My World), grey on black; iOS adds the tint: Coco standing on a little round world, on a warm sunrise sky. One light from the top
       left, no outlines on the globe. render.js puts Coco in at the coco group below. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000"/><stop offset="1" stop-color="#000"/></linearGradient>
    <radialGradient id="glow" cx="0.2" cy="0.1" r="0.8"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".1"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <radialGradient id="sea" cx="0.35" cy="0.3" r="0.8"><stop offset="0" stop-color="#BDBDBD"/><stop offset=".6" stop-color="#9A9A9A"/><stop offset="1" stop-color="#7A7A7A"/></radialGradient>
    <clipPath id="world"><circle cx="512" cy="710" r="270"/></clipPath>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="160%"><feGaussianBlur in="SourceAlpha" stdDeviation="12"/><feOffset dy="12"/>
      <feComponentTransfer><feFuncA type="linear" slope=".2"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#sky)"/><rect width="1024" height="1024" fill="url(#glow)"/>
  <g filter="url(#lift)">
    <circle cx="512" cy="710" r="270" fill="url(#sea)"/>
    <g clip-path="url(#world)">
      <!-- Soft green lands, lighter on top, with a darker underside -->
      <path d="M300 560 Q360 470 470 500 Q540 520 520 600 Q500 660 420 650 Q340 700 300 640 Q260 600 300 560Z" fill="#E6E6E6"/>
      <path d="M560 470 Q660 440 720 520 Q760 600 700 640 Q640 660 610 610 Q580 560 560 470Z" fill="#E6E6E6"/>
      <path d="M380 780 Q480 740 560 790 Q640 850 600 920 Q520 980 430 940 Q350 890 380 780Z" fill="#E6E6E6"/>
      <path d="M690 740 Q760 720 790 780 Q800 840 750 850 Q700 830 690 740Z" fill="#E6E6E6"/>
      <circle cx="512" cy="760" r="300" fill="none" stroke="#333333" stroke-opacity=".25" stroke-width="80"/>
      <ellipse cx="400" cy="560" rx="120" ry="60" fill="#fff" opacity=".22" transform="rotate(-25 400 560)"/>
    </g>
  </g>
  <g filter="url(#lift)"><g id="coco"/></g>
</svg>