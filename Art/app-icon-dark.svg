<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- The dark-mode app icon (My World), a night sky with stars: Coco peeking over her little world, on a lavender sky. One light from the top left,
       no outlines; dark and tinted versions are app-icon-dark.svg and app-icon-tinted.svg. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3A2E6E"/><stop offset="1" stop-color="#140F33"/></linearGradient>
    <radialGradient id="glow" cx="0.2" cy="0.1" r="0.8"><stop offset="0" stop-color="#B9A6FF" stop-opacity=".3"/><stop offset=".5" stop-color="#fff" stop-opacity=".08"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <radialGradient id="sea" cx="0.35" cy="0.3" r="0.8"><stop offset="0" stop-color="#7CCBFA"/><stop offset=".6" stop-color="#3D97E3"/><stop offset="1" stop-color="#2A72C4"/></radialGradient>
    <radialGradient id="green" cx="0.35" cy="0.3" r="0.8"><stop offset="0" stop-color="#9BE07E"/><stop offset=".6" stop-color="#5FB656"/><stop offset="1" stop-color="#3E8F45"/></radialGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="160%"><feGaussianBlur in="SourceAlpha" stdDeviation="14"/><feOffset dy="14"/>
      <feComponentTransfer><feFuncA type="linear" slope=".22"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#sky)"/><rect width="1024" height="1024" fill="url(#glow)"/>
  <circle cx="130" cy="140" r="7" fill="#FFF6D8"/><circle cx="250" cy="80" r="5" fill="#FFF6D8"/><circle cx="850" cy="120" r="8" fill="#FFF6D8"/><circle cx="920" cy="250" r="5" fill="#FFF6D8"/><circle cx="100" cy="330" r="5" fill="#FFF6D8"/><circle cx="760" cy="60" r="4" fill="#FFF6D8"/><circle cx="940" cy="470" r="6" fill="#FFF6D8"/><circle cx="90" cy="620" r="4" fill="#FFF6D8"/>
  <g filter="url(#lift)">
    <!-- Coco behind the world: her two eye bumps and her flower -->
    <circle cx="436" cy="300" r="66" fill="url(#green)"/><circle cx="588" cy="300" r="66" fill="url(#green)"/>
    <circle cx="436" cy="304" r="42" fill="#fff"/><circle cx="588" cy="304" r="42" fill="#fff"/>
    <circle cx="446" cy="312" r="19" fill="#3B2A22"/><circle cx="598" cy="312" r="19" fill="#3B2A22"/>
    <circle cx="440" cy="304" r="6" fill="#fff"/><circle cx="592" cy="304" r="6" fill="#fff"/>
    <g transform="translate(370 262) scale(.95)"><circle cx="26" cy="0" r="22" fill="#F7A8C4"/><circle cx="8.034441853748634" cy="24.72746942367399" r="22" fill="#F7A8C4"/><circle cx="-21.034441853748632" cy="15.282416559604304" r="22" fill="#F7A8C4"/><circle cx="-21.034441853748632" cy="-15.282416559604298" r="22" fill="#F7A8C4"/><circle cx="8.034441853748628" cy="-24.727469423673995" r="22" fill="#F7A8C4"/><circle r="15" fill="#F6C945"/></g>
    <!-- The world -->
    <circle cx="512" cy="620" r="300" fill="url(#sea)"/>
    <path d="M290 490 Q380 420 470 460 Q520 490 500 560 Q470 620 400 600 Q330 630 290 580Z" fill="#7CC46B"/>
    <path d="M580 460 Q690 450 740 540 Q760 620 700 640 Q640 640 610 580Z" fill="#7CC46B"/>
    <path d="M370 720 Q470 680 560 740 Q630 810 580 870 Q490 910 410 860 Q340 810 370 720Z" fill="#7CC46B"/>
    <ellipse cx="400" cy="460" rx="110" ry="50" fill="#fff" opacity=".22" transform="rotate(-25 400 460)"/>
  </g>
</svg>