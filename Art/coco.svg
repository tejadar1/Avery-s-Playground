<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 440">
  <!-- Mixed style: thin outline around the silhouette, soft two-tone colors, small dot eyes. -->
  <defs>
    <g id="shape">
      <path d="M135 350 C70 390 22 352 30 304 C46 336 86 342 126 322 Z"/>
      <circle cx="100" cy="220" r="15"/><circle cx="94" cy="258" r="15"/><circle cx="100" cy="296" r="14"/>
      <ellipse cx="190" cy="318" rx="92" ry="96"/>
      <rect x="134" y="374" width="48" height="56" rx="22"/>
      <rect x="208" y="374" width="48" height="56" rx="22"/>
      <circle cx="124" cy="112" r="38"/>
      <circle cx="166" cy="178" r="88"/>
      <rect x="170" y="130" width="222" height="96" rx="46"/>
      <rect x="176" y="196" width="200" height="64" rx="30"/>
      <circle cx="362" cy="134" r="17"/>
      <circle cx="196" cy="102" r="50"/>
    </g>
  </defs>
  <use href="#shape" fill="#4A2C2A" stroke="#4A2C2A" stroke-width="12" stroke-linejoin="round"/>
  <use href="#shape" fill="#7CC26C"/>
  <!-- two-tone shading -->
  <g fill="#62A957">
    <path d="M135 350 C70 390 22 352 30 304 C46 336 86 342 126 322 Z"/>
    <circle cx="100" cy="220" r="15"/><circle cx="94" cy="258" r="15"/><circle cx="100" cy="296" r="14"/>
    <rect x="134" y="374" width="48" height="56" rx="22"/>
    <circle cx="124" cy="112" r="38"/>
    <path d="M110 290 C108 360 146 406 190 414 C130 412 96 362 102 296Z"/>
    <rect x="176" y="222" width="200" height="38" rx="19"/>
    <path d="M86 196 C100 246 146 266 190 262 L188 248 C146 250 110 232 94 190Z"/>
  </g>
  <!-- belly -->
  <ellipse cx="212" cy="334" rx="56" ry="66" fill="#F6E7B8" stroke="#4A2C2A" stroke-width="5"/>
  <path d="M168 330 C170 372 196 396 226 398 C192 404 160 380 160 334Z" fill="#E9D49A"/>
  <path d="M182 312 h60 M174 338 h76 M182 364 h60" stroke="#E2CC8A" stroke-width="4" stroke-linecap="round"/>
  <!-- mouth, teeth, nostril -->
  <path d="M212 214 Q300 240 382 206" fill="none" stroke="#4A2C2A" stroke-width="6" stroke-linecap="round"/>
  <path d="M248 224 l7 13 l7 -11 Z M288 229 l6 13 l8 -12 Z" fill="#fff" stroke="#4A2C2A" stroke-width="3" stroke-linejoin="round"/>
  <ellipse cx="366" cy="134" rx="5" ry="7" fill="#4A2C2A"/>
  <!-- eyes: white ovals with small dots -->
  <ellipse cx="122" cy="114" rx="17" ry="20" fill="#fff" stroke="#4A2C2A" stroke-width="5"/>
  <circle cx="128" cy="118" r="7" fill="#2B2A33"/>
  <ellipse cx="200" cy="104" rx="25" ry="29" fill="#fff" stroke="#4A2C2A" stroke-width="5"/>
  <circle cx="208" cy="110" r="9" fill="#2B2A33"/>
  <circle cx="211" cy="106" r="3" fill="#fff"/>
  <ellipse cx="228" cy="180" rx="20" ry="11" fill="#F29BA6" opacity=".6"/>
  <!-- waving arm, clear of the snout -->
  <ellipse cx="300" cy="300" rx="19" ry="40" transform="rotate(-55 300 300)" fill="#7CC26C" stroke="#4A2C2A" stroke-width="6"/>
  <!-- flower -->
  <g transform="translate(160 50) rotate(-15)" stroke="#4A2C2A" stroke-width="4">
    <g fill="#F7A1B6"><circle cx="0" cy="-18" r="13"/><circle cx="17" cy="-6" r="13"/><circle cx="10" cy="14" r="13"/><circle cx="-10" cy="14" r="13"/><circle cx="-17" cy="-6" r="13"/></g>
    <circle cx="0" cy="0" r="9" fill="#F9D56E"/>
  </g>
</svg>
