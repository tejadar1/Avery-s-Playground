<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 100 640 680">
  <!-- Nail spots are drawn by NailSalonView.swift; keep NailSalonView.spots in sync with the finger tips here. -->
  <defs>
    <g id="hand">
      <rect x="108" y="250" width="74" height="300" rx="37"/>
      <rect x="196" y="160" width="84" height="380" rx="42"/>
      <rect x="292" y="120" width="88" height="400" rx="44"/>
      <rect x="392" y="170" width="84" height="360" rx="42"/>
      <rect x="474" y="330" width="92" height="260" rx="46" transform="rotate(35 520 460)"/>
      <rect x="108" y="380" width="380" height="300" rx="110"/>
    </g>
  </defs>
  <use href="#hand" fill="#4A2C2A" stroke="#4A2C2A" stroke-width="13" stroke-linejoin="round"/>
  <!-- Two tones: darker skin, then the lighter skin nudged up-left, leaves a soft shadow along each edge. -->
  <mask id="hand-mask"><use href="#hand" fill="#fff"/></mask>
  <g mask="url(#hand-mask)">
    <use href="#hand" fill="#F2C2A8"/>
    <use href="#hand" fill="#FFDCC8" transform="translate(-10 -6)"/>
  </g>
  <!-- knuckles -->
  <g fill="none" stroke="#E7AE95" stroke-width="3.9" stroke-linecap="round">
    <path d="M130 420 q15 7 30 0"/><path d="M222 370 q16 8 32 0"/><path d="M320 350 q16 8 32 0"/><path d="M418 380 q16 8 32 0"/>
    <path d="M128 445 q17 6 34 0"/><path d="M220 398 q18 7 36 0"/><path d="M318 380 q18 7 36 0"/><path d="M416 408 q18 7 36 0"/>
  </g>
  <!-- sleeve -->
  <rect x="140" y="640" width="320" height="150" rx="24" fill="#F2A0B9" stroke="#4A2C2A" stroke-width="6.5"/>
  <rect x="140" y="640" width="320" height="34" rx="17" fill="#FFC2D4" stroke="#4A2C2A" stroke-width="6.5"/>
  <g fill="#fff">
    <circle cx="190" cy="712" r="11"/><circle cx="260" cy="740" r="11"/><circle cx="330" cy="708" r="11"/>
    <circle cx="400" cy="738" r="11"/><circle cx="430" cy="700" r="8"/><circle cx="170" cy="760" r="8"/>
  </g>
  <!-- guide nails, hidden when rendered -->
  <g id="nails" fill="#FFC9D6" stroke="#4A2C2A" stroke-width="3.9">
    <rect x="121" y="268" width="48" height="62" rx="24"/>
    <rect x="210" y="178" width="56" height="72" rx="28"/>
    <rect x="307" y="138" width="58" height="74" rx="29"/>
    <rect x="406" y="188" width="56" height="72" rx="28"/>
    <rect x="535.3" y="360.3" width="60" height="70" rx="30" transform="rotate(35 565.3 395.3)"/>
  </g>
</svg>
