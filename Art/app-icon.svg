<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Step Up, flat: Coco has climbed a stack of toy blocks and stands on A, waving. Same flat two-tone style as the app's art. -->
  <rect width="1024" height="1024" fill="#7CCBF5"/>
  <circle cx="512" cy="360" r="300" fill="#9AD8F8"/>
  <!-- Two puffy clouds at the bottom corners: a dark ring under each puff, then white on top, so they merge into one outline -->
  <g fill="#4A2C2A"><circle cx="70" cy="930" r="100"/><circle cx="170" cy="890" r="95"/><circle cx="260" cy="950" r="85"/><circle cx="-10" cy="990" r="95"/><circle cx="955" cy="930" r="100"/><circle cx="855" cy="895" r="90"/><circle cx="770" cy="955" r="85"/><circle cx="1030" cy="990" r="95"/></g>
  <g fill="#FFFFFF"><circle cx="70" cy="930" r="90"/><circle cx="170" cy="890" r="85"/><circle cx="260" cy="950" r="75"/><circle cx="-10" cy="990" r="85"/><circle cx="955" cy="930" r="90"/><circle cx="855" cy="895" r="80"/><circle cx="770" cy="955" r="75"/><circle cx="1030" cy="990" r="85"/></g>
  <g>
    <clipPath id="clipB"><rect x="256" y="740" width="250" height="250" rx="30"/></clipPath>
    <rect x="256" y="740" width="250" height="250" rx="30" fill="#F6C945"/>
    <rect x="256" y="940" width="250" height="50" fill="#D9A52A" clip-path="url(#clipB)"/>
    <rect x="256" y="740" width="250" height="250" rx="30" fill="none" stroke="#4A2C2A" stroke-width="10"/>
  </g>
  <text x="381.0" y="925" text-anchor="middle" font-family="Arial Rounded MT Bold, Nunito, Arial, sans-serif" font-weight="900" font-size="170" fill="#fff" stroke="#4A2C2A" stroke-width="10" paint-order="stroke" stroke-linejoin="round">B</text>
  <g>
    <clipPath id="clipC"><rect x="518" y="740" width="250" height="250" rx="30"/></clipPath>
    <rect x="518" y="740" width="250" height="250" rx="30" fill="#5B9DEF"/>
    <rect x="518" y="940" width="250" height="50" fill="#3F7BCB" clip-path="url(#clipC)"/>
    <rect x="518" y="740" width="250" height="250" rx="30" fill="none" stroke="#4A2C2A" stroke-width="10"/>
  </g>
  <text x="643.0" y="925" text-anchor="middle" font-family="Arial Rounded MT Bold, Nunito, Arial, sans-serif" font-weight="900" font-size="170" fill="#fff" stroke="#4A2C2A" stroke-width="10" paint-order="stroke" stroke-linejoin="round">C</text>
  <g>
    <clipPath id="clipA"><rect x="387" y="490" width="250" height="250" rx="30"/></clipPath>
    <rect x="387" y="490" width="250" height="250" rx="30" fill="#F2635F"/>
    <rect x="387" y="690" width="250" height="50" fill="#C9474A" clip-path="url(#clipA)"/>
    <rect x="387" y="490" width="250" height="250" rx="30" fill="none" stroke="#4A2C2A" stroke-width="10"/>
  </g>
  <text x="512.0" y="675" text-anchor="middle" font-family="Arial Rounded MT Bold, Nunito, Arial, sans-serif" font-weight="900" font-size="170" fill="#fff" stroke="#4A2C2A" stroke-width="10" paint-order="stroke" stroke-linejoin="round">A</text>
  <g id="coco"/>
</svg>