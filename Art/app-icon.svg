<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- The app icon: Coco on a stack of books (learning, and steps up). One light from the top left, a soft ground
       shadow, no outlines on the books. render.js puts Coco in at the coco group below. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A9E2FC"/><stop offset="1" stop-color="#4FA9EC"/></linearGradient>
    <radialGradient id="glow" cx="0.2" cy="0.1" r="0.75"><stop offset="0" stop-color="#fff" stop-opacity=".6"/><stop offset=".5" stop-color="#fff" stop-opacity=".08"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <radialGradient id="ground" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#1D5C99" stop-opacity=".35"/><stop offset="1" stop-color="#1D5C99" stop-opacity="0"/></radialGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="160%"><feGaussianBlur in="SourceAlpha" stdDeviation="10"/><feOffset dy="10"/>
      <feComponentTransfer><feFuncA type="linear" slope=".18"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#sky)"/><rect width="1024" height="1024" fill="url(#glow)"/>
  <ellipse cx="512" cy="930" rx="300" ry="40" fill="url(#ground)"/>
  <g filter="url(#lift)">
    
  <linearGradient id="b3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B79BFF"/><stop offset="1" stop-color="#8E6FE8"/></linearGradient>
  <rect x="262" y="790" width="500" height="130" rx="26" fill="url(#b3)"/>
  <rect x="296" y="844.6" width="432" height="10" rx="5" fill="#FFFFFF" opacity=".55"/>
  <rect x="262" y="902" width="500" height="18" rx="9" fill="#7458C9" opacity=".9"/>
    
  <linearGradient id="b2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFDA6A"/><stop offset="1" stop-color="#F5B83A"/></linearGradient>
  <rect x="238" y="664" width="548" height="132" rx="26" fill="url(#b2)"/>
  <rect x="272" y="719.44" width="480" height="10" rx="5" fill="#FFFFFF" opacity=".55"/>
  <rect x="238" y="778" width="548" height="18" rx="9" fill="#D9971F" opacity=".9"/>
    
  <linearGradient id="b1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF8E86"/><stop offset="1" stop-color="#F0595B"/></linearGradient>
  <rect x="296" y="548" width="432" height="122" rx="26" fill="url(#b1)"/>
  <rect x="330" y="599.24" width="364" height="10" rx="5" fill="#FFFFFF" opacity=".55"/>
  <rect x="296" y="652" width="432" height="18" rx="9" fill="#C9434A" opacity=".9"/>
  </g>
  <g filter="url(#lift)"><g id="coco"/></g>
</svg>