name: Build

# Mac build minutes are costly, so builds only run when started by hand (Actions → Build → Run workflow),
# once per batch of changes. Pushes and merges don't build.
on:
  workflow_dispatch:
    inputs:
      screenshots:
        description: Take screenshots of every game on iPhone and iPad (adds about 10 minutes)
        type: boolean
        default: false
      voice:
        description: Instead of building, record Coco's voice (record) or voice samples to choose from (samples)
        type: choice
        options: [none, record, samples]
        default: none

# A newer run on the same branch stops the one it replaces.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# Every run tests on one iPhone, then uploads to TestFlight. Screenshots of every game (iPhone and iPad) run only when ticked.
env:
  SHOTS: ${{ inputs.screenshots == true }}

jobs:
  # Coco's voice is made with Kokoro, a free open-source voice, on Linux (Voice/make.py). It commits the recordings
  # to this branch; samples go to the voice-samples branch.
  voice:
    if: inputs.voice != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # Kokoro's dependencies don't build on the runner's newest Python yet.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          sudo apt-get install -y -q ffmpeg
          pip install -q --only-binary :all: kokoro-onnx soundfile
          cd Voice
          curl -sSLO https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          curl -sSLO https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
      - if: inputs.voice == 'samples'
        run: |
          python Voice/make.py --samples
          cd Voice/samples && git init -q -b voice-samples && git add .
          git -c user.name=github-actions -c user.email=actions@github.com commit -qm "Voice samples"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" voice-samples
      - if: inputs.voice == 'record'
        run: |
          # Stop recording in time to save what's done; running it again records the rest.
          timeout 60m python Voice/make.py || echo "Stopped before the end; run voice: record again for the rest."
          git add Voice AverysPlayground/Voice
          git diff --cached --quiet && exit 0
          git -c user.name=github-actions -c user.email=actions@github.com commit -qm "Record Coco's voice"
          git push

  test:
    if: inputs.voice == 'none'
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen && xcodegen
      - name: Build and run tests
        run: |
          udid() { xcrun simctl list devices available | grep -m1 -E "^ +$1" | grep -oE '[0-9A-F-]{36}'; }
          mkdir -p screenshots
          if [ "$SHOTS" = true ]; then
            where=(-destination "id=$(udid iPhone)" -destination "id=$(udid iPad)")
          else
            where=(-destination "id=$(udid iPhone)" -only-testing:AverysPlaygroundTests)
          fi
          TEST_RUNNER_SCREENSHOTS_DIR="$PWD/screenshots" xcodebuild test -project AverysPlayground.xcodeproj \
            -scheme AverysPlayground "${where[@]}" -resultBundlePath TestResults.xcresult CODE_SIGNING_ALLOWED=NO
      - name: Show why tests failed
        if: failure()
        run: |
          xcrun xcresulttool get test-results tests --path TestResults.xcresult | grep -B1 '"nodeType" : "Failure Message"'
      - name: Publish screenshots to the screenshots branch
        if: always() && env.SHOTS == 'true'
        working-directory: screenshots
        run: |
          git init -q -b screenshots && git add .
          git -c user.name=github-actions -c user.email=actions@github.com commit -qm "Screenshots of ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" screenshots

  testflight:
    needs: test
    runs-on: macos-latest
    # Only the .p8 key is a secret; the IDs just say which account and key to use.
    env:
      KEY_ID: LRDVNT6QAA
      ISSUER_ID: 6e584ffe-8197-4f9f-8aa6-7541bb2bc445
      TEAM_ID: 7T84UMWQFK
      KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
    steps:
      - if: env.KEY == ''
        run: echo "The APP_STORE_CONNECT_KEY secret isn't set, so nothing is uploaded. See README > TestFlight."
      - if: env.KEY != ''
        uses: actions/checkout@v4
      - if: env.KEY != ''
        run: brew install xcodegen && xcodegen
      # Archive unsigned; the export step signs with Apple's cloud-managed certificate, so no certificates live in this repo.
      - if: env.KEY != ''
        name: Archive
        run: |
          xcodebuild archive -project AverysPlayground.xcodeproj -scheme AverysPlayground \
            -destination generic/platform=iOS -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO DEVELOPMENT_TEAM="$TEAM_ID" CURRENT_PROJECT_VERSION=${{ github.run_number }}
      - if: env.KEY != ''
        name: Sign and upload to TestFlight
        run: |
          mkdir -p ~/private_keys
          # Rebuild the key's lines, since pasting it on a phone can join them, add spaces or turn dashes into em dashes.
          body=$(printf '%s' "$KEY" | sed 's/BEGIN PRIVATE KEY//; s/END PRIVATE KEY//' | LC_ALL=C tr -cd 'A-Za-z0-9+/=')
          # An Apple .p8 key is 200 base64 characters; the length is safe to print, the key isn't.
          echo "Key is ${#body} characters (an Apple key is 200)."
          printf -- '-----BEGIN PRIVATE KEY-----\n%s\n-----END PRIVATE KEY-----\n' "$(echo "$body" | fold -w 64)" > ~/private_keys/AuthKey_$KEY_ID.p8
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$TEAM_ID</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/App.xcarchive -exportPath build/export \
            -exportOptionsPlist build/ExportOptions.plist -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_$KEY_ID.p8 \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID"
