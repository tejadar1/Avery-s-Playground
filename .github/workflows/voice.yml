name: Coco's voice

# Records Coco's lines (Voice/lines.txt) with ElevenLabs and commits the sound files to the branch it runs on.
# Runs on Linux, so it costs no Mac minutes. Needs the ELEVENLABS_API_KEY repository secret.
on:
  workflow_dispatch:
    inputs:
      voice_id:
        description: ElevenLabs Voice ID for Coco (leave empty to keep the current one)
        required: false

jobs:
  record:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - if: inputs.voice_id != ''
        run: echo "${{ inputs.voice_id }}" > Voice/voice.txt
      - run: python3 Voice/make.py
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      - name: Commit the recordings
        run: |
          git add Voice AverysPlayground/Voice
          git diff --cached --quiet && exit 0
          git -c user.name=github-actions -c user.email=actions@github.com commit -qm "Record Coco's voice"
          git push
